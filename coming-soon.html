<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CardioVita new patient tools and telemedicine portal are launching soon. Subscribe for launch updates.">
    <title>Coming Soon | CardioVita Heart Care Clinic</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <script>(function(){try{if(localStorage.getItem('cv-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('cv-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="CardioVita Home">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E61C1C"/><stop offset="100%" stop-color="#B91C1C"/></linearGradient></defs>
            <rect width="100" height="100" rx="20" fill="url(#logoBg)"/>
            <path d="M50 72 C50 72 25 55 25 40 C25 32 31 26 38 26 C43 26 47 29 50 33 C53 29 57 26 62 26 C69 26 75 32 75 40 C75 55 50 72 50 72Z" fill="white" opacity="0.95"/>
            <path d="M38 44 L44 44 L47 38 L50 50 L53 42 L56 44 L62 44" stroke="#E61C1C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-top">Heart Care</span>
            <span class="brand-bottom">CardioVita</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle layout direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Heart Pulse Badge -->
        <div style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.4rem 0.9rem;border-radius:var(--radius-full);background:rgba(230, 28, 28,0.08);border:1px solid rgba(230, 28, 28,0.2);color:var(--primary);font-size:0.8125rem;font-weight:600;margin-bottom:1.25rem;">
            <i class="fa-solid fa-heart-pulse"></i>
            Next-Gen Cardiac Care
        </div>

        <h1 class="coming-title">Something Extraordinary Is Coming</h1>
        <p class="coming-desc">We're expanding our cardiology digital platform with real-time telemedicine consultations, AI-assisted ECG analysis, and comprehensive patient health tracking.</p>

        <!-- Countdown Grid -->
        <div class="countdown-grid">
            <div class="countdown-item">
                <div class="countdown-value" id="cdDays">45</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cdHours">12</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cdMins">30</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cdSecs">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <!-- Subscribe Form -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Thank you for subscribing! We will notify you the moment we launch.'); this.reset();">
            <input type="email" placeholder="Enter your email for priority access" required aria-label="Email address for notifications">
            <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Notify Me</button>
        </form>

        <!-- Social Links -->
        <div class="coming-socials">
            <a href="https://facebook.com" target="_blank" rel="noopener" class="coming-social-link" title="Facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener" class="coming-social-link" title="Instagram" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener" class="coming-social-link" title="LinkedIn" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener" class="coming-social-link" title="Twitter / X" aria-label="Twitter / X">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();

        // 45-day Countdown Timer
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 45);

        function updateTimer() {
            const now = new Date().getTime();
            const distance = launchDate.getTime() - now;
            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const elDays = document.getElementById('cdDays');
            const elHours = document.getElementById('cdHours');
            const elMins = document.getElementById('cdMins');
            const elSecs = document.getElementById('cdSecs');

            if (elDays) elDays.textContent = String(days).padStart(2, '0');
            if (elHours) elHours.textContent = String(hours).padStart(2, '0');
            if (elMins) elMins.textContent = String(minutes).padStart(2, '0');
            if (elSecs) elSecs.textContent = String(seconds).padStart(2, '0');
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    });
</script>
</body>
</html>
