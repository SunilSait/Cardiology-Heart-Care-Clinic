<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — CardioVita Heart Care</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1">
    <script>(function(){try{if(localStorage.getItem('cv-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('cv-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
    <style>
        .cs-pulse{font-size:3.5rem;color:var(--primary);margin-bottom:1.5rem;animation:csPulse 1.5s ease infinite;}
        @keyframes csPulse{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.15);opacity:1;}}
        .cs-title{font-size:2.5rem;font-weight:600;color:var(--text);margin-bottom:0.5rem;}
        .cs-desc{font-size:1rem;font-weight:450;color:var(--text-light);max-width:520px;margin:0 auto 2.5rem;line-height:1.65;}
        .countdown-grid{display:flex;justify-content:center;gap:1.25rem;margin-bottom:2.5rem;flex-wrap:wrap;}
        .cd-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.25rem 1.5rem;min-width:90px;text-align:center;box-shadow:var(--shadow-sm);}
        .cd-num{font-size:2rem;font-weight:600;color:var(--primary);line-height:1;}
        .cd-label{font-size:0.75rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.25rem;}
        .cs-form{display:flex;gap:0.5rem;max-width:420px;margin:0 auto 2rem;flex-wrap:wrap;}
        .cs-input{flex:1;min-width:200px;padding:0.7rem 1rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text);font-size:0.875rem;font-family:var(--font);}
        .cs-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(185,28,58,0.12);}
        .cs-socials{display:flex;justify-content:center;gap:0.75rem;margin-top:1rem;}
        .cs-social-link{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:1rem;transition:all 0.2s ease;}
        .cs-social-link:hover{border-color:var(--primary);color:var(--primary);background:rgba(185,28,58,0.04);}
        @media(max-width:768px){.cs-title{font-size:1.85rem;}.cd-item{min-width:70px;padding:1rem;}.cd-num{font-size:1.5rem;}}
        @media(max-width:360px){.cs-title{font-size:1.5rem;}.countdown-grid{gap:0.75rem;}.cs-form{flex-direction:column;}.cs-form .btn{width:100%;}}
    </style>
</head>
<body>
    <div class="utility-page">
        <div class="utility-top-controls">
            <button class="nav-icon-btn" id="rtlToggle" onclick="toggleDir()" aria-label="Toggle RTL"><span class="dir-indicator" style="font-size:0.625rem;font-weight:600;">LTR</span></button>
            <button class="nav-icon-btn" id="darkToggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><span class="theme-icon-wrap"><i class="fas fa-moon"></i></span></button>
        </div>
        <a href="index.html" class="utility-logo-link" id="utilLogoLink"></a>
        <div class="cs-pulse"><i class="fas fa-heartbeat"></i></div>
        <h1 class="cs-title">Coming Soon</h1>
        <p class="cs-desc">We're building something extraordinary for your heart health. Our new patient portal features, telemedicine consultations, and advanced health tracking tools are launching soon.</p>
        <div class="countdown-grid">
            <div class="cd-item"><div class="cd-num" id="cdDays">00</div><div class="cd-label">Days</div></div>
            <div class="cd-item"><div class="cd-num" id="cdHours">00</div><div class="cd-label">Hours</div></div>
            <div class="cd-item"><div class="cd-num" id="cdMins">00</div><div class="cd-label">Minutes</div></div>
            <div class="cd-item"><div class="cd-num" id="cdSecs">00</div><div class="cd-label">Seconds</div></div>
        </div>
        <form class="cs-form" onsubmit="event.preventDefault(); alert('Thank you! We will notify you when we launch.'); this.reset();">
            <input type="email" class="cs-input" placeholder="Enter your email for updates" required>
            <button type="submit" class="btn btn-primary">Notify Me</button>
        </form>
        <div class="cs-socials">
            <a href="https://facebook.com" target="_blank" rel="noopener" class="cs-social-link" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://instagram.com" target="_blank" rel="noopener" class="cs-social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://linkedin.com" target="_blank" rel="noopener" class="cs-social-link" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://twitter.com" target="_blank" rel="noopener" class="cs-social-link" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
        </div>
    </div>
    <script src="components.js"></script>
    <script>
        document.getElementById('utilLogoLink').innerHTML = LOGO_SVG + '<div class="nav-logo-text"><span class="brand-top">Heart Care</span><span class="brand-bottom">CardioVita</span></div>';
        updateDarkIcons(); updateRTLIndicators();
        // Countdown
        const target = new Date();
        target.setDate(target.getDate() + 45);
        function updateCountdown() {
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return;
            const d = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const m = Math.floor((diff % (1000*60*60)) / (1000*60));
            const s = Math.floor((diff % (1000*60)) / 1000);
            document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
            document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
            document.getElementById('cdMins').textContent = String(m).padStart(2,'0');
            document.getElementById('cdSecs').textContent = String(s).padStart(2,'0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
