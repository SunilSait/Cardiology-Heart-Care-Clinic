<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — CardioVita Heart Care</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1">
    <script>(function(){try{if(localStorage.getItem('cv-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('cv-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
    <style>
        .error-code{font-size:8rem;font-weight:600;line-height:1;color:var(--primary);opacity:0.15;margin-bottom:-1rem;}
        .error-title{font-size:2rem;font-weight:600;color:var(--text);margin-bottom:0.75rem;}
        .error-desc{font-size:1rem;font-weight:450;color:var(--text-light);max-width:480px;margin:0 auto 2rem;line-height:1.6;}
        .error-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0.75rem;margin-bottom:2rem;}
        .error-link{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.875rem;font-weight:500;color:var(--text);transition:all 0.2s ease;}
        .error-link:hover{border-color:var(--primary);color:var(--primary);background:rgba(185,28,58,0.04);}
        .error-contact{font-size:0.875rem;color:var(--text-muted);}
        .error-contact a{color:var(--primary);font-weight:500;}
        .error-heart{font-size:3rem;color:var(--primary);opacity:0.3;margin-bottom:1rem;}
        @media(max-width:768px){.error-code{font-size:5rem;}.error-title{font-size:1.5rem;}}
    </style>
</head>
<body>
    <div class="utility-page">
        <div class="utility-top-controls">
            <button class="nav-icon-btn" id="rtlToggle" onclick="toggleDir()" aria-label="Toggle RTL"><span class="dir-indicator" style="font-size:0.625rem;font-weight:600;">LTR</span></button>
            <button class="nav-icon-btn" id="darkToggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><span class="theme-icon-wrap"><i class="fas fa-moon"></i></span></button>
        </div>
        <a href="index.html" class="utility-logo-link" id="utilLogoLink"></a>
        <div class="error-heart"><i class="fas fa-heart-pulse"></i></div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let us help you find your way back to cardiac care.</p>
        <div class="error-links">
            <a href="index.html" class="error-link"><i class="fas fa-house"></i> Home</a>
            <a href="services.html" class="error-link"><i class="fas fa-stethoscope"></i> Services</a>
            <a href="doctors.html" class="error-link"><i class="fas fa-user-doctor"></i> Doctors</a>
            <a href="contact.html" class="error-link"><i class="fas fa-envelope"></i> Contact</a>
            <a href="dashboard.html" class="error-link"><i class="fas fa-chart-line"></i> Dashboard</a>
        </div>
        <p class="error-contact">Need help? Call <a href="tel:18004327428">+1 (800) HEART-28</a> or email <a href="mailto:care@cardiovita.com">care@cardiovita.com</a></p>
    </div>
    <script src="components.js"></script>
    <script>
        document.getElementById('utilLogoLink').innerHTML = LOGO_SVG + '<div class="nav-logo-text"><span class="brand-top">Heart Care</span><span class="brand-bottom">CardioVita</span></div>';
        updateDarkIcons(); updateRTLIndicators();
    </script>
</body>
</html>
